[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-customer-support-bot"
version = "1.1.1"
authors = [
  { name="Kirill" },
]
description = "A small Python prototype for subscription descriptions and TON payment links."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/Kirilka4345/ai-customer-support-ticket-bot"

[tool.setuptools]
py-modules = ["support_bot"]
