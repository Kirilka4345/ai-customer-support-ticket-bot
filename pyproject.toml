[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-customer-support-bot"
version = "1.1.0"
authors = [
  { name="Kirill", email="kirillopen4345@gmail.com" },
]
description = "AI Customer Support Ticket Triage and Sentiment Classification Bot"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/Kirilka4345/ai-customer-support-ticket-bot"
"Commercial License" = "https://kirillopen.gumroad.com/l/mfpqo"
"Funding" = "https://kirillopen.gumroad.com"
